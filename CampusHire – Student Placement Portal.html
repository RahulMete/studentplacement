<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CampusHire – Student Placement Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#5b6b85;--pr:#1d4ed8;--pr2:#0f2f7a;--bd:#dce3ef;--ok:#15803d;--no:#b91c1c;--wa:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121c31;--tx:#e8eefc;--mu:#93a3c0;--pr:#4f8cff;--pr2:#1e3a8a;--bd:#24324f;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121c31;--tx:#e8eefc;--mu:#93a3c0;--pr:#4f8cff;--pr2:#1e3a8a;--bd:#24324f;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-size:20px;cursor:pointer;letter-spacing:.3px}header span{font-size:13px;opacity:.85}
.nav button{margin-left:8px}
main{max-width:1000px;margin:0 auto;padding:22px 16px}
.hero{text-align:center;padding:40px 10px 20px}.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}.hero p{color:var(--mu);max-width:560px;margin:0 auto 26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px 20px;text-align:center;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.tile .ic{font-size:34px}.tile h3{margin:8px 0 4px}.tile p{color:var(--mu);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.narrow{max-width:420px;margin:20px auto}
h2{margin:0 0 14px}h3{margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mu)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--pr);color:#fff;font-weight:600}
button:hover{filter:brightness(1.1)}button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.ok{background:var(--ok)}button.no{background:var(--no)}button.sm{padding:6px 12px;font-size:13px}
header button{background:rgba(255,255,255,.18)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:13px}.chip a{color:var(--pr);text-decoration:none}
.chip.x{cursor:pointer}
.co{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.co .card{margin:0;display:flex;flex-direction:column;gap:6px}.co .nm{font-size:18px;font-weight:700}
.meta{color:var(--mu);font-size:14px}.acts{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--bd)}
.Accepted{color:var(--ok)}.Rejected{color:var(--no)}.Pending{color:var(--wa)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.err{color:var(--no);font-size:13px;margin-top:8px}.msg{color:var(--ok);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.sw{display:flex;gap:6px;margin-bottom:14px}.sw button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.sw button.on{background:var(--pr);color:#fff}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
</style></head><body>
<header><div><b onclick="go('home')">🎓 CampusHire</b><br><span>Student Placement Portal</span></div><div class="nav" id="nav"></div></header>
<main id="app"></main><footer>© 2026 CampusHire Placement Cell</footer>
<script>
const ADMIN={u:"rahulmete07@gmail.com",p:"rahulmete@007"};
let mem=null;
const seed={users:[],apps:[],companies:[
{id:1,name:"TechNova Solutions",salary:"₹6,00,000 / year",skills:"JavaScript, React, Node.js",location:"Pune"},
{id:2,name:"InfraSoft Pvt Ltd",salary:"₹4,50,000 / year",skills:"Java, SQL, Spring Boot",location:"Mumbai"},
{id:3,name:"DataBridge Analytics",salary:"₹7,20,000 / year",skills:"Python, Machine Learning, Power BI",location:"Bengaluru"}]};
function load(){try{const d=localStorage.getItem("ch_db");if(d)return JSON.parse(d)}catch(e){}return mem||JSON.parse(JSON.stringify(seed))}
let db=load();
function save(){mem=db;try{localStorage.setItem("ch_db",JSON.stringify(db))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let view="home",me=null,admin=false,mode="login",tab="co",atab="apps";
function go(v){view=v;render()}
function nav(){let h="";if(me||admin)h+=`<button onclick="logout()">Logout</button>`;else if(view!="home")h+=`<button onclick="go('home')">Home</button>`;$("nav").innerHTML=h}
function logout(){me=null;admin=false;go("home")}
function render(){nav();const a=$("app");
 if(view=="home")a.innerHTML=`<div class="hero"><h1>Your Career Starts Here</h1><p>Create your profile, explore top companies and apply for jobs & internships — all in one place.</p></div>
 <div class="tiles">
 <div class="tile"><div class="ic">🎓</div><h3>Student Login</h3><p>Build your profile and apply to companies.</p><button onclick="go('student')">Student Login</button></div>
 <div class="tile"><div class="ic">🛡️</div><h3>Admin Login</h3><p>Review applications and manage companies.</p><button onclick="go('admin')">Admin Login</button></div>
 <div class="tile"><div class="ic">🏢</div><h3>Company View</h3><p>See all companies available in the portal.</p><button onclick="go('companies')">Company View</button></div></div>`;
 else if(view=="student")authView();
 else if(view=="dash")dash();
 else if(view=="admin")a.innerHTML=`<div class="card narrow"><h2>Admin Login</h2><label>Username</label><input id="au" type="email" placeholder="Admin email"><label>Password</label><input id="ap" type="password" placeholder="Password"><div class="err" id="err"></div><br><button onclick="adminLogin()">Login</button></div>`;
 else if(view=="adash")adminDash();
 else if(view=="companies")a.innerHTML=`<h2>Companies in Portal</h2>${coList(false)}`;
}
function authView(){const l=mode=="login";$("app").innerHTML=`<div class="card narrow"><div class="sw"><button class="${l?"on":""}" onclick="mode='login';render()">Login</button><button class="${l?"":"on"}" onclick="mode='create';render()">Create Account</button></div>
 <h2>${l?"Student Login":"Create Account"}</h2>${l?"":`<label>Full Name</label><input id="sn" placeholder="Your name">`}
 <label>Email ID</label><input id="se" type="email" placeholder="you@example.com"><label>Password</label><input id="sp" type="password" placeholder="Password">
 <div class="err" id="err"></div><br><button onclick="studentAuth()">${l?"Login":"Create Account"}</button></div>`}
function studentAuth(){const e=$("se").value.trim().toLowerCase(),p=$("sp").value,err=$("err");
 if(!e||!p)return err.textContent="Please fill all fields.";
 if(mode=="create"){const n=$("sn").value.trim();if(!n)return err.textContent="Please enter your name.";
  if(!/^\S+@\S+\.\S+$/.test(e))return err.textContent="Enter a valid email.";if(p.length<6)return err.textContent="Password must be 6+ characters.";
  if(db.users.find(u=>u.email==e))return err.textContent="Account already exists. Please login.";
  me={name:n,email:e,pass:p,phone:"",skills:"",resume:"",social:[]};db.users.push(me);save();tab="pr";go("dash")}
 else{const u=db.users.find(u=>u.email==e&&u.pass==p);if(!u)return err.textContent="Invalid email or password.";me=u;tab="co";go("dash")}}
function dash(){const t=(k,n)=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${n}</button>`;
 let b="";if(tab=="pr")b=profile();else if(tab=="co")b=`<h2>Apply to Companies</h2>${coList(true)}`;else b=myApps();
 $("app").innerHTML=`<h2>Welcome, ${esc(me.name)} 👋</h2><div class="tabs">${t("pr","My Profile")}${t("co","Companies")}${t("ap","My Applications")}</div>${b}`}
function profile(){return `<div class="card"><h3>Full Profile</h3><div class="row">
 <div><label>Name</label><input id="pn" value="${esc(me.name)}"></div><div><label>Email</label><input value="${esc(me.email)}" disabled></div>
 <div><label>Phone Number</label><input id="pph" value="${esc(me.phone)}" placeholder="10-digit number"></div>
 <div><label>Skills (comma separated)</label><input id="psk" value="${esc(me.skills)}" placeholder="Java, Python, SQL"></div></div>
 <label>Resume</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="pr" type="file" accept=".pdf,.doc,.docx" style="max-width:280px"><button class="sec sm" onclick="addResume()">Add Resume</button><span class="meta">${me.resume?"📄 "+esc(me.resume):"No resume added"}</span></div>
 <br><button onclick="saveProfile()">Save Profile</button> <span class="msg" id="ok"></span></div>
 <div class="card"><h3>Social Media Links</h3><div class="row"><div><label>Platform</label><select id="sl"><option>LinkedIn</option><option>GitHub</option><option>Instagram</option><option>Twitter / X</option><option>Portfolio</option></select></div>
 <div><label>Link / URL</label><input id="su" placeholder="https://..."></div></div><br><button class="sec" onclick="addSocial()">+ Add Link</button><div class="err" id="serr"></div>
 <div class="links">${me.social.map((s,i)=>`<span class="chip"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.p)}</a> <span class="x" style="cursor:pointer" onclick="rmSocial(${i})">✕</span></span>`).join("")||'<span class="meta">No links added yet.</span>'}</div></div>`}
function addResume(){const f=$("pr").files[0];if(!f)return alert("Please choose a resume file first.");me.resume=f.name;save();render()}
function saveProfile(){me.name=$("pn").value.trim()||me.name;me.phone=$("pph").value.trim();me.skills=$("psk").value.trim();save();$("ok").textContent="✔ Profile saved";}
function addSocial(){let u=$("su").value.trim();if(!u)return $("serr").textContent="Enter a link.";if(!/^https?:\/\//i.test(u))u="https://"+u;
 try{new URL(u)}catch(e){return $("serr").textContent="Invalid URL."}me.social.push({p:$("sl").value,url:u});save();render()}
function rmSocial(i){me.social.splice(i,1);save();render()}
function coList(apply){if(!db.companies.length)return `<div class="card meta">No companies added yet.</div>`;
 return `<div class="co">${db.companies.map(c=>`<div class="card"><div class="nm">🏢 ${esc(c.name)}</div><div class="meta">💰 ${esc(c.salary)}</div><div class="meta">📍 ${esc(c.location)}</div><div class="meta">🛠️ ${esc(c.skills)}</div>
 ${apply?`<div class="acts"><button class="sm" onclick="applyTo(${c.id},'Job')">Apply Job</button><button class="sm sec" onclick="applyTo(${c.id},'Internship')">Apply Internship</button></div>`:""}</div>`).join("")}</div>`}
function applyTo(id,type){if(!me.phone||!me.skills||!me.resume){alert("Please complete your profile (phone, skills & resume) before applying.");tab="pr";return render()}
 if(db.apps.find(a=>a.email==me.email&&a.cid==id&&a.type==type))return alert("You already applied for this "+type+".");
 db.apps.push({id:Date.now(),email:me.email,cid:id,type,status:"Pending"});save();alert("Applied for "+type+" successfully!")}
function myApps(){const l=db.apps.filter(a=>a.email==me.email);if(!l.length)return `<div class="card meta">You have not applied anywhere yet.</div>`;
 return `<div class="card tw"><table><tr><th>Company</th><th>Type</th><th>Status</th></tr>${l.map(a=>`<tr><td>${esc(cn(a.cid))}</td><td>${a.type}</td><td><span class="badge ${a.status}">${a.status}</span></td></tr>`).join("")}</table></div>`}
const cn=id=>(db.companies.find(c=>c.id==id)||{name:"(removed)"}).name;
function adminLogin(){if($("au").value.trim()==ADMIN.u&&$("ap").value==ADMIN.p){admin=true;atab="apps";go("adash")}else $("err").textContent="Invalid admin username or password."}
function adminDash(){const t=(k,n)=>`<button class="${atab==k?"on":""}" onclick="atab='${k}';render()">${n}</button>`;let b="";
 if(atab=="apps")b=db.apps.length?`<div class="card tw"><table><tr><th>Student</th><th>Contact</th><th>Skills</th><th>Company</th><th>Type</th><th>Status</th><th>Decision</th></tr>${db.apps.map(a=>{const u=db.users.find(x=>x.email==a.email)||{};
  return `<tr><td><b>${esc(u.name)}</b><br><span class="meta">${esc(a.email)}</span></td><td>${esc(u.phone)}<br><span class="meta">📄 ${esc(u.resume)}</span></td><td>${esc(u.skills)}<div class="links">${(u.social||[]).map(s=>`<span class="chip"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.p)}</a></span>`).join("")}</div></td><td>${esc(cn(a.cid))}</td><td>${a.type}</td><td><span class="badge ${a.status}">${a.status}</span></td>
  <td style="white-space:nowrap"><button class="ok sm" onclick="decide(${a.id},'Accepted')">Accept</button> <button class="no sm" onclick="decide(${a.id},'Rejected')">Reject</button></td></tr>`}).join("")}</table></div>`:`<div class="card meta">No applications received yet.</div>`;
 else if(atab=="add")b=`<div class="card"><h3>Add Company</h3><div class="row"><div><label>Company Name</label><input id="cnm"></div><div><label>Salary</label><input id="csa" placeholder="₹5,00,000 / year"></div>
  <div><label>Skills Required</label><input id="csk" placeholder="Java, SQL"></div><div><label>Location</label><input id="clo"></div></div><div class="err" id="err"></div><br><button onclick="addCo()">Add Company</button></div>`;
 else b=coList(false);
 $("app").innerHTML=`<h2>Admin Dashboard</h2><div class="tabs">${t("apps","All Applications ("+db.apps.length+")")}${t("add","Add Company")}${t("list","Companies ("+db.companies.length+")")}</div>${b}`}
function decide(id,s){db.apps.find(a=>a.id==id).status=s;save();render()}
function addCo(){const v=i=>$(i).value.trim(),n=v("cnm"),s=v("csa"),k=v("csk"),l=v("clo");if(!n||!s||!k||!l)return $("err").textContent="Please fill all fields.";
 db.companies.push({id:Date.now(),name:n,salary:s,skills:k,location:l});save();atab="list";render()}
render();
</script></body></html>
